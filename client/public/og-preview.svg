<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Logo area -->
  <text x="80" y="120" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="url(#accent)" opacity="0.9">RL</text>

  <!-- Main title -->
  <text x="80" y="220" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#f1f5f9">Rulos Locos</text>
  <text x="80" y="280" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="30" fill="#94a3b8">Dashboard Financiero Argentino</text>

  <!-- Divider -->
  <rect x="80" y="315" width="200" height="3" rx="2" fill="url(#accent)"/>

  <!-- Feature pills -->
  <rect x="80" y="345" width="180" height="38" rx="19" fill="#22d3ee" fill-opacity="0.12"/>
  <text x="170" y="369" font-family="system-ui, sans-serif" font-size="17" fill="#22d3ee" text-anchor="middle">💱 Arbitraje</text>

  <rect x="278" y="345" width="210" height="38" rx="19" fill="#a78bfa" fill-opacity="0.12"/>
  <text x="383" y="369" font-family="system-ui, sans-serif" font-size="17" fill="#a78bfa" text-anchor="middle">📊 Macro BCRA</text>

  <rect x="506" y="345" width="200" height="38" rx="19" fill="#4ade80" fill-opacity="0.12"/>
  <text x="606" y="369" font-family="system-ui, sans-serif" font-size="17" fill="#4ade80" text-anchor="middle">🏦 Plazo Fijo</text>

  <rect x="80" y="400" width="210" height="38" rx="19" fill="#fb923c" fill-opacity="0.12"/>
  <text x="185" y="424" font-family="system-ui, sans-serif" font-size="17" fill="#fb923c" text-anchor="middle">📈 Portfolio</text>

  <rect x="308" y="400" width="220" height="38" rx="19" fill="#f472b6" fill-opacity="0.12"/>
  <text x="418" y="424" font-family="system-ui, sans-serif" font-size="17" fill="#f472b6" text-anchor="middle">🔔 Alertas</text>

  <!-- Right side: mock chart bars -->
  <g opacity="0.7">
    <rect x="780" y="260" width="40" height="220" rx="4" fill="url(#green)" opacity="0.3"/>
    <rect x="840" y="200" width="40" height="280" rx="4" fill="url(#green)" opacity="0.5"/>
    <rect x="900" y="320" width="40" height="160" rx="4" fill="url(#accent)" opacity="0.4"/>
    <rect x="960" y="180" width="40" height="300" rx="4" fill="url(#green)" opacity="0.6"/>
    <rect x="1020" y="240" width="40" height="240" rx="4" fill="url(#accent)" opacity="0.5"/>
    <rect x="1080" y="150" width="40" height="330" rx="4" fill="url(#green)" opacity="0.7"/>
    <rect x="1140" y="190" width="40" height="290" rx="4" fill="url(#accent)" opacity="0.6"/>
  </g>

  <!-- URL -->
  <text x="80" y="565" font-family="system-ui, sans-serif" font-size="22" fill="#475569">rulos-locos.vercel.app</text>

  <!-- Bottom right badge -->
  <rect x="940" y="540" width="220" height="50" rx="10" fill="#22d3ee" fill-opacity="0.1"/>
  <text x="1050" y="572" font-family="system-ui, sans-serif" font-size="18" fill="#22d3ee" text-anchor="middle" font-weight="600">Tiempo Real 🇦🇷</text>
</svg>
